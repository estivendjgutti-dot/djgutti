; Supervisor em modo foreground (supervisord -n), sem systemd e sem painel HTTP.
; %(here)s = pasta deste arquivo (config/); todos os caminhos são absolutos a partir dela.
; Iniciar SEMPRE por scripts/start.sh (idempotente).

[unix_http_server]
file=%(here)s/../run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
directory=%(here)s/..
pidfile=%(here)s/../run/supervisord.pid
logfile=%(here)s/../logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=3
loglevel=info
childlogdir=%(here)s/../logs
umask=077
; TZ só afeta a exibição; o banco grava UTC.
environment=TZ="America/Sao_Paulo",PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1"

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../run/supervisor.sock

[program:worker]
command=%(here)s/../.venv/bin/python -u %(here)s/../src/worker.py
directory=%(here)s/..
autostart=true
; reinicia só em saída inesperada (exit 0 = parada intencional)
autorestart=unexpected
exitcodes=0
; precisa ficar 5 s no ar para contar como iniciado; 5 falhas seguidas -> FATAL (sem loop infinito)
startsecs=5
startretries=5
stopsignal=TERM
; maior que o timeout das tarefas (máx. 60 s) para o checkpoint terminar
stopwaitsecs=90
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../logs/worker.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3

[eventlistener:events]
command=%(here)s/../.venv/bin/python -u %(here)s/../src/events_listener.py
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED,PROCESS_STATE_BACKOFF
autostart=true
autorestart=true
startsecs=1
stdout_logfile=NONE
stderr_logfile=%(here)s/../logs/events.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=3
